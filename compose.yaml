services:
  yanetviz:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      YANETVIZ_PASSWORD: ${YANETVIZ_PASSWORD:?Set an administrator password in your environment}
    volumes:
      - yanetviz-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  yanetviz-data:
